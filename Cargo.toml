[package]
name = "nn_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
cudarc = { version = "0.19.10", features = ["cuda-13010"] }
ndarray = { version = "0.17.2", features = ["serde"] }
ndarray-rand = "0.16.0"
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
